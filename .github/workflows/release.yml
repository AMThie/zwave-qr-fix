# Publishes to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing (OpenID Connect): no API token is stored
# anywhere. PyPI trusts this exact workflow file in this exact repository.
#
# Nothing is uploaded until ALL of these are true:
#   1. a trusted publisher for this workflow exists on pypi.org,
#   2. the repository variable PYPI_PUBLISH_ENABLED is set to "true",
#   3. a reviewer approves the deployment to the "pypi" environment.
name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in release builds (avoids cache poisoning).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/zwave_qr_fix/_version.py').read())[1])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package version v$version"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zwave-qr-fix/
    permissions:
      id-token: write # OIDC token for Trusted Publishing, nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Also uploads PEP 740 attestations that prove where the files were built.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
