[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zwave-qr-fix"
dynamic = ["version"]
description = "Repair malformed Z-Wave SmartStart QR codes that Z-Wave JS rejects (ZW1406), e.g. on Heatit Z-TRM6 thermostats."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Thiers" }]
keywords = [
  "z-wave",
  "zwave",
  "smartstart",
  "qr-code",
  "home-assistant",
  "zwave-js",
  "s2",
  "dsk",
  "heatit",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# The core logic only needs the standard library.
dependencies = []

[project.optional-dependencies]
image = [
  # zxing-cpp 3.x claims Python 3.9 support but ships no 3.9 wheels and
  # cannot be built from source there, so stay on 2.x for Python 3.9.
  "zxing-cpp>=2.2,<3; python_version < '3.10'",
  "zxing-cpp>=2.2; python_version >= '3.10'",
  "pillow>=9.1",
  "pillow-heif>=0.16",
]
png = ["qrcode[pil]>=7.4"]
all = ["zwave-qr-fix[image,png]"]

[project.scripts]
zwave-qr-fix = "zwave_qr_fix.cli:main"

[project.urls]
Homepage = "https://github.com/AMThie/zwave-qr-fix"
Issues = "https://github.com/AMThie/zwave-qr-fix/issues"
Changelog = "https://github.com/AMThie/zwave-qr-fix/blob/main/CHANGELOG.md"

# Development-only dependencies (PEP 735). Unlike extras, they are not part
# of the published package metadata. Install with: pip install --group dev
[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = [
  "ruff>=0.6",
  # mypy 2.x dropped python_version = "3.9"; lift this with the 3.9 minimum.
  "mypy>=1.11,<2",
  # Only needed so mypy can check the tests. pytest 9 uses match statements,
  # which mypy rejects when targeting Python 3.9.
  "pytest>=8,<9",
]
dev = [{ include-group = "test" }, { include-group = "lint" }, "pre-commit>=3"]

[tool.hatch.version]
path = "src/zwave_qr_fix/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zwave_qr_fix"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
# Lint against the oldest supported Python, not the one ruff runs on.
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # flake8-bugbear: likely bugs
  "UP",      # pyupgrade: modern syntax for the target version
  "SIM",     # flake8-simplify
  "C4",      # flake8-comprehensions
  "PT",      # flake8-pytest-style
  "RUF",     # ruff-specific rules
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # en dashes and ✓/✗ in output are intentional
]

[tool.ruff.lint.per-file-ignores]
# Tests contain complete 90-digit QR strings and exact CLI output.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional runtime dependencies without type information
module = ["zxingcpp", "PIL", "PIL.*", "pillow_heif", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["zwave_qr_fix"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]
